plugins { id 'com.android.application' }

android {
    namespace 'org.masterofmagic.arena'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    defaultConfig {
        applicationId 'org.masterofmagic.arena'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation files('libs/arena.aar')
}
